# Config path in Railway: /apps/web/railway.toml
# Keep service Root Directory = / (repo root) for pnpm workspace installs.
# Set NEXT_PUBLIC_API_URL before building (build-time env).

[build]
builder = "RAILPACK"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @escalation/web build"

[deploy]
startCommand = "pnpm --filter @escalation/web start"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
