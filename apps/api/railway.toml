# Config path in Railway: /apps/api/railway.toml
# Keep service Root Directory = / (repo root) for pnpm workspace installs.

[build]
builder = "RAILPACK"
buildCommand = "pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter @escalation/api build"

[deploy]
startCommand = "pnpm start:api:prod"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
